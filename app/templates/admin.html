{% extends "base.html" %}

{% block title %}JWT RBAC — Admin{% endblock %}

{% block content %}
<div class="app-container">
    <nav class="nav">
        <div class="nav-brand">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="#6366f1">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/>
            </svg>
            JWT RBAC
        </div>
        <ul class="nav-links">
            <li><a href="{{ request.app.state.router_prefix if request.app and request.app.state and request.app.state.router_prefix is defined else '' }}/dashboard">Dashboard</a></li>
            <li><a href="{{ request.app.state.router_prefix if request.app and request.app.state and request.app.state.router_prefix is defined else '' }}/admin-panel" class="active">Admin Panel</a></li>
            <li><a href="#" onclick="logout(); return false;" class="btn btn-ghost btn-sm">Logout</a></li>
        </ul>
    </nav>

    <h1>Admin Panel</h1>
    <p class="mb-4">Manage users and roles</p>

    <div id="adminAlert" class="alert"></div>

    <div id="usersLoading" class="loading-overlay">
        <span class="spinner"></span> Loading users...
    </div>

    <div id="usersContent" style="display:none;">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Roles</th>
                        <th>Status</th>
                        <th>Joined</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTable">
                    <tr class="empty-state-row">
                        <td colspan="5" class="empty-state">No users found</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Protect: redirect if not admin
    if (!hasRole('ADMIN')) {
        window.location.href = ROUTER_PREFIX + '/';
    }

    let allRoles = [];

    async function loadRoles() {
        const res = await fetchWithAuth(ROUTER_PREFIX + '/admin/roles');
        if (res && res.ok) {
            allRoles = await res.json();
        }
    }

    async function loadUsers() {
        const res = await fetchWithAuth(ROUTER_PREFIX + '/admin/users');
        if (res && res.ok) {
            const users = await res.json();
            renderUsers(users);
            document.getElementById('usersLoading').style.display = 'none';
            document.getElementById('usersContent').style.display = 'block';
        } else if (res && res.status === 403) {
            document.getElementById('usersLoading').innerHTML =
                '<p class="text-muted">Access Denied: ADMIN role required.</p>';
        }
    }

    function renderUsers(users) {
        const tbody = document.getElementById('usersTable');

        if (users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No users found</td></tr>';
            return;
        }

        tbody.innerHTML = users.map(user => {
            const roleBadges = user.roles.map(r => {
                const cls = r.name === 'ADMIN' ? 'badge-admin'
                    : r.name === 'MODERATOR' ? 'badge-moderator'
                    : 'badge-user';
                return `<span class="badge ${cls}">${r.name}</span>`;
            }).join(' ');

            const statusBadge = user.is_active
                ? '<span class="badge badge-active">Active</span>'
                : '<span class="badge badge-inactive">Inactive</span>';

            const joinDate = new Date(user.created_at).toLocaleDateString('en-US', {
                year: 'numeric', month: 'short', day: 'numeric'
            });

            const userRoleNames = user.roles.map(r => r.name);
            const roleOptions = allRoles
                .filter(r => !userRoleNames.includes(r.name))
                .map(r => `<option value="${r.name}">${r.name}</option>`)
                .join('');

            const revokeOptions = user.roles
                .map(r => `<option value="${r.name}">Revoke ${r.name}</option>`)
                .join('');

            return `<tr>
                <td>${user.email}</td>
                <td><div class="flex gap-2" style="flex-wrap:wrap;">${roleBadges || '<span class="text-muted text-sm">None</span>'}</div></td>
                <td>${statusBadge}</td>
                <td class="text-muted text-sm">${joinDate}</td>
                <td>
                    <div class="flex gap-2" style="flex-wrap:wrap;">
                        <select onchange="assignRole('${user.id}', this.value, 'assign'); this.selectedIndex=0;" style="min-width:100px;">
                            <option value="">+ Assign</option>
                            ${roleOptions}
                        </select>
                        ${user.roles.length > 0 ? `
                        <select onchange="assignRole('${user.id}', this.value, 'revoke'); this.selectedIndex=0;" style="min-width:100px;">
                            <option value="">− Revoke</option>
                            ${revokeOptions}
                        </select>` : ''}
                        <button class="btn btn-sm ${user.is_active ? 'btn-danger' : 'btn-primary'}"
                                onclick="toggleActive('${user.id}', '${user.email}', ${user.is_active})">
                            ${user.is_active ? 'Deactivate' : 'Activate'}
                        </button>
                    </div>
                </td>
            </tr>`;
        }).join('');
    }

    async function assignRole(userId, roleName, action) {
        if (!roleName) return;

        const res = await fetchWithAuth(ROUTER_PREFIX + `/admin/users/${userId}/roles`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role_name: roleName, action: action }),
        });

        if (res && res.ok) {
            showAlert('adminAlert', `Role ${roleName} ${action === 'assign' ? 'assigned' : 'revoked'} successfully`, 'success');
            loadUsers();
        } else if (res) {
            const err = await res.json();
            showAlert('adminAlert', err.message || 'Failed to update role');
        }
    }

    async function toggleActive(userId, email, currentStatus) {
        const action = currentStatus ? 'Deactivate' : 'Activate';
        if (!confirm(`${action} ${email}?`)) return;

        const res = await fetchWithAuth(ROUTER_PREFIX + `/admin/users/${userId}/toggle-active`, {
            method: 'PATCH',
        });

        if (res && res.ok) {
            showAlert('adminAlert', `User ${action.toLowerCase()}d successfully`, 'success');
            loadUsers();
        } else if (res) {
            const err = await res.json();
            showAlert('adminAlert', err.message || 'Failed to toggle status');
        }
    }

    // Load data
    (async () => {
        await loadRoles();
        await loadUsers();
    })();
</script>
{% endblock %}
