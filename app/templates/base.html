<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JWT + RBAC Starter Kit — Production-ready authentication and authorization">
    <title>{% block title %}JWT RBAC{% endblock %}</title>
    <!-- Favicon: inline SVG lock icon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z'/></svg>">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ request.app.state.router_prefix if request.app and request.app.state and request.app.state.router_prefix is defined else '' }}/static/styles.css">
</head>
<body>
    {% block content %}{% endblock %}

    <script>
        const ROUTER_PREFIX = "{{ request.app.state.router_prefix if request.app and request.app.state and request.app.state.router_prefix is defined else '' }}";
        // --- Auth Utilities ---
        function getAuthToken() { return localStorage.getItem('access_token'); }
        function getRefreshToken() { return localStorage.getItem('refresh_token'); }
        function setTokens(access, refresh) {
            localStorage.setItem('access_token', access);
            localStorage.setItem('refresh_token', refresh);
        }
        function clearTokens() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
        }

        // Decode JWT payload without verification (client-side display only)
        function decodeJwt(token) {
            try {
                const payload = token.split('.')[1];
                return JSON.parse(atob(payload.replace(/-/g, '+').replace(/_/g, '/')));
            } catch { return null; }
        }

        function hasRole(roleName) {
            const token = getAuthToken();
            if (!token) return false;
            const payload = decodeJwt(token);
            return payload && payload.roles && payload.roles.includes(roleName);
        }

        async function logout() {
            const token = getAuthToken();
            const refreshToken = getRefreshToken();
            if (token) {
                try {
                    await fetch(ROUTER_PREFIX + '/auth/logout', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                    });
                } catch (e) { /* ignore */ }
            }
            clearTokens();
            window.location.href = ROUTER_PREFIX + '/';
        }

        async function fetchWithAuth(url, options = {}) {
            const token = getAuthToken();
            if (!token) { window.location.href = ROUTER_PREFIX + '/'; return; }

            const headers = {
                ...options.headers,
                'Authorization': `Bearer ${token}`,
            };
            let response = await fetch(url, { ...options, headers });

            // If 401, try refresh
            if (response.status === 401) {
                const refreshed = await tryRefreshToken();
                if (refreshed) {
                    headers['Authorization'] = `Bearer ${getAuthToken()}`;
                    response = await fetch(url, { ...options, headers });
                } else {
                    clearTokens();
                    window.location.href = ROUTER_PREFIX + '/';
                    return;
                }
            }

            return response;
        }

        async function tryRefreshToken() {
            const refreshToken = getRefreshToken();
            if (!refreshToken) return false;
            try {
                const res = await fetch(ROUTER_PREFIX + '/auth/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refresh_token: refreshToken }),
                });
                if (res.ok) {
                    const data = await res.json();
                    setTokens(data.access_token, data.refresh_token);
                    return true;
                }
            } catch (e) { /* ignore */ }
            return false;
        }

        // Show alert helper
        function showAlert(containerId, message, type = 'error') {
            const el = document.getElementById(containerId);
            if (!el) return;
            el.textContent = message;
            el.className = `alert alert-${type} show`;
            if (type === 'success') {
                setTimeout(() => el.classList.remove('show'), 3000);
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
